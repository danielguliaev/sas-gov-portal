[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-gov-portal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "bleach>=6.1,<7", "PyJWT[crypto]>=2.8,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
browser = ["playwright>=1.50,<2"]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
