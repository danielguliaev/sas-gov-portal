name: Tests
on:
  push:
    branches: [feat/legislative-system-v1, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Python tests
        run: pytest -q
      - name: Frontend syntax
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Browser UI smoke test
        env:
          RUN_BROWSER_TESTS: '1'
        run: pytest -q tests/test_browser.py tests/test_browser_reader.py
      - name: Upload portal preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-law-ui
          path: test-results/*.png
          if-no-files-found: ignore
